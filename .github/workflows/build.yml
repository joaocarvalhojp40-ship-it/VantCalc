name: Build VantCalc APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Montar projeto Android
        run: |
          ls -la
          HTML=$(ls *.html 2>/dev/null | head -n 1)
          if [ -z "$HTML" ]; then echo "ERRO: nenhum arquivo .html no repositorio"; exit 1; fi
          mkdir www
          cp "$HTML" www/index.html
          echo '{"name":"vantcalc","version":"1.0.0"}' > package.json
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 lucide@0.263.1
          cp node_modules/lucide/dist/umd/lucide.min.js www/lucide.min.js
          sed -i 's#https://cdn.jsdelivr.net/npm/lucide@0.263.1/dist/umd/lucide.min.js#lucide.min.js#' www/index.html
          npx cap init VantCalc com.vantcalc.app --web-dir=www
          npx cap add android
          npx cap sync android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VantCalc v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
